<!DOCTYPE html>
<html>
  <head>
    <title>ESP32 Kontrol Lampu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        font-family: "Poppins", sans-serif;
        display: inline-block;
        text-align: center;
      }
      body {
        margin: 0;
        background-color: #1a1a1a;
        color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        max-width: 450px;
        width: 100%;
        padding: 20px;
        box-sizing: border-box;
      }
      .header {
        font-size: 2rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 20px;
      }
      .card-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 30px;
      }
      .card {
        background-color: #2c2c2c;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s;
      }
      .card:hover {
        transform: translateY(-5px);
      }
      .card-title {
        font-size: 1rem;
        font-weight: 600;
        color: #cccccc;
        margin-bottom: 10px;
      }
      .card-value {
        font-size: 2.2rem;
        font-weight: 700;
        color: #4caf50;
      }
      .card-value .unit {
        font-size: 1.2rem;
        font-weight: 400;
        color: #a0a0a0;
      }
      .switch-card {
        background-color: #2c2c2c;
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      .switch-label {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 15px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 80px;
        height: 44px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        border-radius: 44px;
        transition: 0.4s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 36px;
        width: 36px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        border-radius: 50%;
        transition: 0.4s;
      }
      input:checked + .slider {
        background-color: #4caf50;
      }
      input:checked + .slider:before {
        transform: translateX(36px);
      }
      .status {
        margin-top: 15px;
        font-size: 1rem;
        font-weight: 600;
      }
      .status-on {
        color: #4caf50;
      }
      .status-off {
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">Monitoring Fitting Lampu</div>
      <div class="card-grid">
        <div class="card">
          <div class="card-title">Tegangan</div>
          <div class="card-value">
            <span id="voltage">0.00</span><span class="unit"> V</span>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Arus</div>
          <div class="card-value">
            <span id="current">0.00</span><span class="unit"> A</span>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Daya</div>
          <div class="card-value">
            <span id="power">0.00</span><span class="unit"> W</span>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Energi</div>
          <div class="card-value">
            <span id="energy">0.000</span><span class="unit"> kWh</span>
          </div>
        </div>
      </div>
      <div class="switch-card">
        <div class="switch-label">Status Lampu</div>
        <label class="switch">
          <input
            type="checkbox"
            onchange="toggleCheckbox(this)"
            id="relaySwitch"
          />
          <span class="slider"></span>
        </label>
        <div id="relayStatus" class="status status-off">MATI</div>
      </div>
    </div>

    <script>
      var gateway = `ws://${window.location.hostname}/ws`;
      var websocket;
      window.addEventListener("load", onload);

      function onload(event) {
        initWebSocket();
      }

      function initWebSocket() {
        console.log("Trying to open a WebSocket connection...");
        websocket = new WebSocket(gateway);
        websocket.onopen = onOpen;
        websocket.onclose = onClose;
        websocket.onmessage = onMessage;
      }

      function onOpen(event) {
        console.log("Connection opened");
      }

      function onClose(event) {
        console.log("Connection closed");
        setTimeout(initWebSocket, 2000);
      }

      function onMessage(event) {
        console.log(event.data);
        var data = JSON.parse(event.data);
        document.getElementById("voltage").innerText = data.voltage.toFixed(2);
        document.getElementById("current").innerText = data.current.toFixed(2);
        document.getElementById("power").innerText = data.power.toFixed(2);
        document.getElementById("energy").innerText = data.energy.toFixed(3);

        var relaySwitch = document.getElementById("relaySwitch");
        var relayStatus = document.getElementById("relayStatus");

        if (data.relayState) {
          relaySwitch.checked = true;
          relayStatus.innerText = "MENYALA";
          relayStatus.className = "status status-on";
        } else {
          relaySwitch.checked = false;
          relayStatus.innerText = "MATI";
          relayStatus.className = "status status-off";
        }
      }

      function toggleCheckbox(element) {
        console.log("Toggle Switch");
        websocket.send("toggle");
      }
    </script>
  </body>
</html>
